version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apiforge-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apiforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiforge_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-apiforge_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apiforge} -d ${POSTGRES_DB:-apiforge_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apiforge-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: apiforge-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-apiforge}:${POSTGRES_PASSWORD:-apiforge_secure_pass}@postgres:5432/${POSTGRES_DB:-apiforge_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_apiforge_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_super_secret_refresh_jwt_key_2026}
      STORAGE_VAULT_PATH: /app/storage
    ports:
      - "4000:4000"
    volumes:
      - local_storage_vault:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: apiforge-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_prod_data:
  redis_prod_data:
  local_storage_vault:
